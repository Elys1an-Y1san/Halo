<style>
*{box-sizing:border-box}html{background:#f5f6f8;color:var(--text1,#20232c);font:14px/1.6 system-ui}body{margin:0;background:#f5f6f8}a{color:inherit;text-decoration:none}.bili-header__bar{background:#fff;border-bottom:1px solid #dfe2e8;padding:20px 5vw;display:flex;justify-content:space-between}.site-brand{font-size:22px;letter-spacing:-.04em;font-weight:600}.lab-tag{font-size:12px;color:var(--text3,#758091)}#app{background:#f5f6f8;max-width:1440px;margin:auto;padding:40px 5vw;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px}.video-info-title{font-size:28px;line-height:1.3;font-weight:500;margin:0 0 16px;color:var(--text1,#20232c)}video{display:block;width:100%;aspect-ratio:16/9;background:#1d2a39}.video-desc-container{background:#fff;border:1px solid #e0e3e9;padding:24px;margin-top:20px;color:var(--text2,#404651);border-radius:10px}.video-desc-container h2{font-size:18px;margin:0 0 8px}.video-desc-container p{margin:0}.up-name{font-size:15px;color:var(--text2,#404651)}.video-pod{background:#fff;border:1px solid #e0e3e9;border-radius:10px;padding:22px}.video-pod h2{font-size:16px;margin:0 0 20px}.video-page-card-small{padding:18px 0;border-top:1px solid #e0e3e9}.video-page-card-small .title{color:var(--text2,#404651);font-size:14px}.swatch{height:62px;background:linear-gradient(135deg,#61849b,#e0a26e);border-radius:6px;margin-bottom:12px}.instruction{font-size:12px;color:#7a8392;margin:24px 0}.lab-tools{display:flex;gap:12px;margin-top:16px}.lab-tools button{padding:8px 12px;border:1px solid #a2aabc;background:transparent;color:inherit;border-radius:6px;cursor:pointer}@media(max-width:800px){#app{grid-template-columns:1fr}.video-pod{display:none}}

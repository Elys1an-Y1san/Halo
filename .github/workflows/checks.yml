name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 Source/tests/repository-policy.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Source/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: Source
      - run: npm run build
        working-directory: Source
      - run: python3 package-halo.py
        working-directory: Source
      - run: npx --yes web-ext@10.7.0 lint --source-dir ../Builds/firefox/current/Firefox
        working-directory: Source
      - run: node --test tests/*.test.cjs
        working-directory: Source
      - run: node tests/render-regression.cjs && node tests/bilibili-policy.test.cjs
        working-directory: Source
      - run: python3 tests/package-check.py
        working-directory: Source
      - run: npx eslint src/scripts/halo-{ui,controls,wave,update,background}.js src/scripts/{bilibili,x-player}.js
        working-directory: Source
